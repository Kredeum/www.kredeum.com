# Netlify configuration for www.kredeum.com
# Site 100% statique : aucun build côté Netlify, on sert directement www/.
# Les sources SCSS/JS/images vivent dans src/ et sont compilées localement
# (voir README.md) puis committées dans www/assets/.

[build]
  # On limite Netlify au sous-dossier www/ pour qu'il n'y voie pas
  # le package.json racine (qui dépend de node-sass, KO sur Node 22).
  # Résultat : aucune installation de dépendances, aucun build, publication directe.
  base    = "www"
  publish = "."
  # Pas de "command" : rien à builder.

# Cache agressif pour les assets versionnés par le chemin /assets/.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache court pour le HTML racine afin de pouvoir déployer des correctifs rapidement.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# En-têtes de sécurité de base pour un site vitrine statique.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
